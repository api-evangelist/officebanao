name: Officebanao
description: >-
  Officebanao is a technology-enabled office interior design and build company headquartered in
  Gurugram and Bengaluru, India, and founded in 2021. It delivers turnkey commercial workspace
  solutions — space planning, interior design, furniture procurement, office renovation, and
  end-to-end project execution — for startups, enterprises, and coworking spaces across 40+ Indian
  cities. Its "Tech plus Touch" delivery model pairs real-time 3D visualization and online progress
  tracking with an in-house team of designers and project managers. Backed by Lightspeed Venture
  Partners. Officebanao publishes a public marketing website and an llms.txt discovery file but
  exposes no public developer API, SDK, or developer platform surface as of this profiling.
